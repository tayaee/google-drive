[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "google-drive"
version = "0.1.0"
description = "Google Drive WebDAV mount and CLI utility"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.0.0",
    "wsgidav>=4.3.0",
    "cheroot>=10.0.0",
    "requests>=2.28.0",
    "pydantic>=2.0.0",
]

[project.scripts]
google-drive = "google_drive.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/google_drive"]

